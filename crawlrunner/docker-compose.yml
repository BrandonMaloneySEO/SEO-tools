version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crawlrunner_postgres
    environment:
      POSTGRES_DB: crawlrunner
      POSTGRES_USER: ${USER}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crawlrunner_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: